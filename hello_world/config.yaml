name: Hello World
version: "1.1.0"
slug: hello_world
description: A simple Hello World add-on with a sidebar web UI
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: application
boot: manual
# Web UI via Home Assistant Ingress (shows in sidebar)
ingress: true
ingress_port: 8099
panel_icon: mdi:hand-wave
panel_title: Hello World
# Allows the web UI to read/save add-on options
hassio_api: true
options:
  message: "Hello world!"
  name: "Home Assistant"
  color: "#03a9f4"
  log_interval: 60
schema:
  message: str
  name: str
  color: match(^#[0-9a-fA-F]{6}$)
  log_interval: int(5,3600)
