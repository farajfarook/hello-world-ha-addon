# Imitates Home Assistant Ingress: serves the add-on under a path prefix
# from IP 172.30.32.2 (the only IP server.py accepts).
server {
    listen 80;
    absolute_redirect off;

    location = / {
        return 302 /api/hassio_ingress/dev/;
    }

    location /api/hassio_ingress/dev/ {
        proxy_pass http://addon:8099/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Ingress-Path /api/hassio_ingress/dev;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
